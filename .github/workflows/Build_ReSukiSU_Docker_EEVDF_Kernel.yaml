name: Build ReSukiSU Docker EEVDF Kernel

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'
    - cron: '0 12 * * 5'
    - cron: '0 12 * * 3'

jobs:
  build:
    name: Compile Kernel
    runs-on: ubuntu-24.04

    steps:
      - name: Configure Fast APT Mirror
        uses: vegardit/fast-apt-mirror.sh@v1

      - name: Make Build Environment
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y kmod cpio binutils cmake binutils-aarch64-linux-gnu git wget pahole automake flex lzop bison gperf build-essential zip curl zlib1g-dev libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip dwarves device-tree-compiler python3 ccache git-lfs gnupg imagemagick libelf-dev libncurses5-dev libsdl1.2-dev gpart fuse2fs e2fsck-static icu-doc rsync adb fastboot libstdc++6 python-is-python3 gcc-aarch64-linux-gnu 
          mkdir -p kernel
      - name: Checkout Kernel Source
        uses: actions/checkout@v6
        with:
          repository: miaizhe/Kernel_oppo_sm7325_Reno10
          path: kernel/msm-5.4
          fetch-depth: 1
          ref: ee-v1

      - name: Checkout Modules Source
        uses: actions/checkout@v6
        with:
          repository: oppo-source/android_kernel_modules_and_devicetree_oppo_sm7325
          path: temp_modules
          ref: oppo/sm7325_v_15.0.0_reno10

      - name: Prepare Compiler
        run: |
          mkdir -p compiler
          cd compiler
          
          curl -fL "https://github.com/Rancemxn/android_kernel_oppo_sm7325/releases/download/BuildTool/linux-x86-refs_heads_llvm-r383902b-clang-r383902.tar.gz" -o clang-r383902.tar.gz --connect-timeout 30 --retry 5 --retry-delay 5
          mkdir -p clang-bin
          tar -xzf clang-r383902.tar.gz -C clang-bin
          rm clang-r383902.tar.gz
      - name: Handle Dependencies
        run: |
          mv temp_modules/vendor ./vendor
          mv temp_modules/device ./device
          rm -rf temp_modules
      - name: Set Release Info & Custom Version
        run: |
          BUILD_DATE=$(date +%Y%m%d)
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

      - name: Compile Kernel
        run: |
          export PATH="$(pwd)/compiler/clang-bin/bin:$PATH"
          export CROSS_COMPILE="aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="arm-linux-androideabi-"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CLANG_PATH="$(pwd)/compiler/clang-bin/bin"
          export ARCH="arm64"
          export SUBARCH="arm64"
          cd kernel/msm-5.4
          # ==========================================================
          # ★ 充电修复（同步自 9RT eevdf 树的诊断结论）
          # 问题: 电池电量/充电读不到 -> /sys/class/power_supply 为空
          # 根因: drivers/power/Makefile 走 oplus/ 分支, 而 DTB 需要 oplus_chg/
          #   ifeq (CONFIG_OPLUS_CHG_OP9RT_PMIC_VOOCPHY, y) -> oplus/
          #   else ifeq (CONFIG_CHG_FOR_OP9_PRO, y)         -> oplus_chg/
          # 而 CONFIG_OPLUS_CHG_OP9RT_PMIC_VOOCPHY 是 default y 的有效符号,
          # scripts/config -d 关不掉(olddefconfig 会设回 y), 所以直接改 Makefile。
          #
          # oplus_chg/ 里正是 DTB 需要的驱动:
          #   oplus_chg_intf.o / oplus_chg_gki.o / oplus_warp.o
          #   charger_ic/oplus_hl7227.o / charger_ic/oplus_pm8350b.o
          #   wireless_ic/oplus_p9415.o / gauge_ic/oplus_bq27541.o / warp_ic/oplus_rk826.o
          # ==========================================================
          echo "=== 充电修复: drivers/power/Makefile -> oplus_chg/ ==="
          set +e
          cp drivers/power/Makefile /tmp/power_makefile.bak
          sed -i 's|+= oplus/$|+= oplus_chg/|' drivers/power/Makefile
          cat drivers/power/Makefile
          if grep -q "oplus_chg/" drivers/power/Makefile; then
            echo "  OK: oplus_chg/ 已进入 Makefile"
          else
            echo "  FAIL: oplus_chg/ 未加入"; exit 1
          fi
          echo ""
          echo "=== 充电修复: 源码级定义 OPLUS_CHG_OP_DEF ==="
          # oplus_charger.h 里 15 处 #ifdef OPLUS_CHG_OP_DEF 依赖它:
          #   CHG_VUSBIN_VOL_THR / charger_exist_delay / usb_chg_disable
          #   disconnect_vbus / oplus_usb_type / reconnect_count ...
          # ccflags-y 对复合对象不生效, 所以直接改源码。
          cd drivers/power/oplus_chg
          for f in $(find . -name '*.h' -o -name '*.c'); do
            if ! grep -q 'define OPLUS_CHG_OP_DEF' "$f" 2>/dev/null; then
              sed -i '1i #ifndef OPLUS_CHG_OP_DEF\n#define OPLUS_CHG_OP_DEF 1\n#endif' "$f"
            fi
          done
          cd - >/dev/null 2>&1
          n=$(grep -rl 'define OPLUS_CHG_OP_DEF' drivers/power/oplus_chg/ 2>/dev/null | wc -l || echo 0)
          echo "  已处理文件数: $n"
          if [ "$n" -lt 5 ]; then echo "  FAIL: 处理文件太少"; exit 1; fi
          echo "  OK: 宏已在源码中定义"
          echo ""
          echo "=== 充电修复: 删除重复的 oplus_chg_voter.o ==="
          # oplus_chg/oplus_chg_voter.c 和 qcom/pmic-voter.c 导出完全同名的符号
          # (lock_votable/unlock_votable/vote/create_votable/... 共 20 个)
          # 本 defconfig 是 CONFIG_QTI_BATTERY_CHARGER=y, 两份都进 vmlinux -> duplicate symbol
          # 两份符号完全一致, 删掉 OPLUS 那份即可。
          sed -i '/oplus_chg_voter\.o/d' drivers/power/oplus_chg/Makefile
          if grep -q "oplus_chg_voter" drivers/power/oplus_chg/Makefile; then
            echo "  FAIL: 未删除"; exit 1
          else
            echo "  OK: oplus_chg_voter.o 已移除"
          fi
          echo ""
          set -e
          echo "=== 充电修复完成, 开始编译 ==="
          rm -r KernelSU
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          make O=out CC="clang" LLVM=1 Reno10-Docker_defconfig  
          ./scripts/config --file out/.config \
            -d CONFIG_KSU_TRACEPOINT_HOOK \
            -e CONFIG_KSU_MANUAL_HOOK
          make O=out CC="clang" LLVM=1 -j$(nproc)
      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          sed -i '584s|ui_print " " "Done!";|ui_print " "; ui_print "感谢支持芜夕wuxi内核，刷入完成！"; ui_print "祝你玩的愉快！";|' AnyKernel3/META-INF/com/google/android/update-binary
          
          cp kernel/msm-5.4/out/arch/arm64/boot/Image AnyKernel3/
          mkdir -p AnyKernel3/modules/vendor/lib/modules
          find kernel/msm-5.4/out/ -name "*.ko" -exec cp {} AnyKernel3/modules/vendor/lib/modules/ \;
          
          cd AnyKernel3
          rm anykernel.sh
          wget https://github.com/miaizhe/Kernel_oppo_sm7325_Reno10/releases/download/boot/anykernel.sh
          zip -r9 ../ReSukiSU-Reno10-EEVDF-Docker-${{ env.BUILD_DATE }}.zip * -x .git* README.md *placeholder

      - name: Pack WithoutTWRP Boot Image
        run: |
          pwd
          mkdir -p boot_pack
          cd boot_pack
          wget https://raw.githubusercontent.com/miaizhe/magiskboot-linux/refs/heads/main/x86_64/magiskboot
          chmod +x magiskboot
          curl -fL "https://github.com/miaizhe/Kernel_oppo_sm7325_Reno10/releases/download/boot/boot_a.img" -o boot_origin.img
          ./magiskboot unpack boot_origin.img
          if [ ! -f "../kernel/msm-5.4/out/arch/arm64/boot/Image" ]; then
            echo "错误：编译出的 Image 文件不存在，请检查编译步骤！"
            exit 1
          fi
          cp ../kernel/msm-5.4/out/arch/arm64/boot/Image kernel
          ./magiskboot repack boot_origin.img ../boot-ReSukiSU-Reno10-EEVDF-WithoutTWRP-Docker-${{ env.BUILD_DATE }}.img
          pwd
          cd ..
          pwd

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v6
        with:
          name: ReSukiSU_Reno10_Docker_EEVDF.img
          path: |
            boot-ReSukiSU-Reno10-EEVDF-WithoutTWRP-Docker-${{ env.BUILD_DATE }}.img
            ReSukiSU-Reno10-EEVDF-Docker-${{ env.BUILD_DATE }}.zip

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_DATE }}
          name: KernelSU Kernel for Reno10 (${{ env.BUILD_DATE }})
          body: |
            - 编译日期: ${{ env.BUILD_DATE }}
            - 核心版本: 5.4.254
            - 包含功能: ReSukiSU,KernelSU-Next
            - 欢迎刷入芜夕wuxi的内核！祝你玩的愉快！
            - 文件：分为带SuSFS的和不带SukiSU的，zip为ak3包，img文件为打包好的镜像，Docker为带Docker的,test为测试版
          files: |
              ReSukiSU-Reno10-EEVDF-Docker-${{ env.BUILD_DATE }}.zip
              boot-ReSukiSU-Reno10-EEVDF-WithoutTWRP-Docker-${{ env.BUILD_DATE }}.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
